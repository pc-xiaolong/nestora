name: Nesstora quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < functions/api/products.js
          node --input-type=module --check < assets/site.js
          node --input-type=module --check < scripts/production-smoke.mjs
      - name: Check Pages configuration and internal links
        run: node scripts/smoke-test.mjs
      - name: Run product API regression tests
        run: node --test tests/products.test.mjs
