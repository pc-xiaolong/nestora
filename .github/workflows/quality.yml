name: Nestora quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < worker.js
          node --input-type=module --check < functions/api/products.js
          node --input-type=module --check < assets/site.js
      - name: Check repository and internal links
        run: node scripts/smoke-test.mjs
