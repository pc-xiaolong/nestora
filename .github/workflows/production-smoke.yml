name: Nesstora production smoke monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Nesstora quality gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nesstora-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for Pages deployment propagation
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 90
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployed production
        run: node scripts/production-smoke.mjs
